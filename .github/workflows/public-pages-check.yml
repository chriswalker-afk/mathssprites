name: Diagnose published Maths Sprites

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-pages-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect actual public HTML CSS JS and deployment settings
        run: node scripts/check-public-site.mjs
      - name: Retain precise deployment check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pages-diagnostic
          path: artifacts/pages-deployment-diagnostic.json
          if-no-files-found: warn
          retention-days: 5
