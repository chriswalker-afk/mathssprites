name: Browser animation QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  # Full regression still runs weekly, without delaying ordinary PR reviews.
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

# The newest push replaces any unfinished QA for the same PR.
concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke QA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache pinned Playwright npm package
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-mathssprites-pw-npm-1.65.1-v1
      - name: Install Playwright test
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --prefer-offline @playwright/test@1.65.1
      - name: Fast browser checks — navigation, stars, notebook and scene animation
        run: npx playwright test --grep @smoke --workers=2
      - name: Keep viewport screenshots for compact layout review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maths-sprites-viewport-preview
          path: |
            artifacts/pr27-*.png
            artifacts/pr28-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep screenshots and traces on smoke failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maths-sprites-browser-smoke
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The full multi-minute suite does not block every small PR edit. It runs
  # after merging to main, on a weekly schedule, by manual dispatch, or when
  # a PR is explicitly labelled "full-browser-qa".
  full-browser:
    name: Full browser regression (${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-browser-qa')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache pinned Playwright npm package
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-mathssprites-pw-npm-1.65.1-v1
      - name: Install Playwright test
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --prefer-offline @playwright/test@1.65.1
      - name: Complete animation, hand and maths regression (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/3 --workers=1
      - name: Keep screenshots and traces for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maths-sprites-browser-qa-shard-${{ matrix.shard }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
