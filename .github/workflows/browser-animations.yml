name: Browser animation QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede earlier browser runs for the same PR. This avoids
# stacking several 3-minute animation suites while a PR is being developed.
concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All browser specs run, but distributed across independent runners. Each
# shard has its own server and browser to keep animation timing reliable.
jobs:
  browser-animation:
    name: Browser animation QA (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright test (QA-only, not a game dependency)
        run: npm install --no-save @playwright/test@1.65.1
      - name: Check animation, levels and hand choreography (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/3 --workers=1
      - name: Keep screenshots and traces for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maths-sprites-browser-qa-shard-${{ matrix.shard }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
