name: World 4 published release check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/square-*.mjs'
      - 'src/site.mjs'
      - 'src/app.mjs'
      - 'index.html'
      - 'scripts/check-live-squares.mjs'
      - 'scripts/world4-release-probe.mjs'
      - '.github/workflows/world4-release-check.yml'

permissions:
  contents: read

concurrency:
  group: world4-published-release
  cancel-in-progress: true

jobs:
  live-squares:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome browser probe
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.65.1
      - name: Verify deployed release bytes and actual student journeys
        run: npm run check:live:world4 -- --wait
      - name: Retain published release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world4-published-release
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
